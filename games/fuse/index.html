<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuse · BALLPARK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='8' y='13' font-size='13' text-anchor='middle'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<style>
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #1d1d22; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; user-select: none; }
  .app { display: grid; grid-template-columns: 1fr 330px; height: 100%; }
  .board { position: relative; overflow: hidden; touch-action: none;
    background: radial-gradient(circle at 1px 1px, #e6e6ea 1px, transparent 0) 0 0 / 22px 22px, #fff; }
  .brand { position: absolute; top: 14px; left: 16px; pointer-events: none; }
  .brand h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
  .brand p { margin: 2px 0 0; font-size: 13px; color: #7a7a85; }
  .tools { position: absolute; bottom: 14px; right: 14px; display: flex; gap: 6px; }
  .tools button { border: 1px solid #ddd; background: #fff; border-radius: 10px; padding: 7px 11px; font: 600 13px "Segoe UI", sans-serif; cursor: pointer; }
  .item { position: absolute; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid #d6d6dc; border-radius: 9px; background: #fff;
    font: 600 16px "Segoe UI", "Segoe UI Emoji", system-ui, sans-serif; white-space: nowrap; cursor: grab; box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: box-shadow .12s, transform .12s; touch-action: none; }
  .item .e { font-size: 18px; }
  .item:hover { border-color: #9a9aa6; }
  .item.drag { cursor: grabbing; box-shadow: 0 8px 20px rgba(0,0,0,.14); transform: scale(1.04); z-index: 1000; }
  .item.target { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.25); }
  .item.picked { border-color: #6366f1; background: #eef0ff; }
  .item.pop { animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  .item.nope { animation: nope .35s; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  @keyframes nope { 25%, 75% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
  .side { border-left: 1px solid #e6e6ea; display: flex; flex-direction: column; min-height: 0; background: #fff; }
  .side .head { padding: 12px; border-bottom: 1px solid #eee; }
  .side input { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 10px; font: 15px "Segoe UI", sans-serif; outline: none; }
  .side .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12.5px; color: #7a7a85; }
  .side .meta button { border: 0; background: none; color: #6366f1; font: 600 12.5px "Segoe UI", sans-serif; cursor: pointer; }
  .list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; }
  .list .item { position: static; font-size: 15px; padding: 6px 10px; }
  .list .item.new::after { content: "new"; margin-left: 4px; font-size: 10px; font-weight: 800; color: #fff; background: #6366f1; border-radius: 6px; padding: 1px 5px; }
  .toast { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); padding: 9px 14px; border-radius: 10px; background: #1d1d22; color: #fff; font-size: 14px; z-index: 2000; pointer-events: none; }
  .first { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; color: #a0a0aa; font-size: 15px; pointer-events: none; }
  @media (max-width: 720px) { .app { grid-template-columns: 1fr; grid-template-rows: 1fr 38%; } .side { border-left: 0; border-top: 1px solid #e6e6ea; } .brand h1 { font-size: 20px; } }
</style>
</head>
<body data-bp-pos="tr">
<div class="app">
  <div class="board" id="board">
    <div class="brand"><h1>Fuse</h1><p>Drag things together to make new things.</p></div>
    <div class="first" id="first">Drag an element from the list onto the board,<br>then drop one on top of another. (Or tap two of them.)</div>
    <div class="tools"><button id="clear">Clear board</button><button id="mute">🔊</button></div>
    <div id="toast" class="toast" hidden></div>
  </div>
  <aside class="side">
    <div class="head"><input id="search" placeholder="Search your discoveries…" aria-label="Search">
      <div class="meta"><span id="count">4 discovered</span><span><button id="sort">Sort: newest</button> · <button id="share">Share</button></span></div></div>
    <div class="list" id="list"></div>
  </aside>
</div>
<script src="../../shared/bp.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
