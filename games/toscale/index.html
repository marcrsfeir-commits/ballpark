<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To Scale · BALLPARK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b1020'/%3E%3Crect x='2' y='9' width='4' height='5' fill='%236aa8ff'/%3E%3Crect x='8' y='3' width='6' height='11' fill='%23e5212e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h1>To Scale <button id="helpBtn" class="info" aria-label="How to play">ⓘ</button></h1>
  <p class="sub">Match the silhouette to its real-world size.</p>
  <p id="archHead" class="arch-head" hidden></p>
  <p class="round"><span id="roundLabel">ROUND 1 / 5</span> · SCORE <b id="scoreLabel">0</b></p>
  <div class="stage-wrap">
    <canvas id="stage" aria-label="Stage: drag the red silhouette to resize it"></canvas>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="fit" aria-label="Fit both">⤢</button></div>
    <div id="badge" class="badge" hidden></div>
    <p class="hint" id="hint">drag the red one up/down · scroll · ↑↓ keys</p>
  </div>
  <div class="bar">
    <div class="names"><div id="refLine" class="ref"></div><div id="tgtLine" class="tgt"></div><div id="fact" class="fact"></div></div>
    <button id="lock" class="lock">Lock In</button>
  </div>
  <section id="end" class="end" hidden></section>
  <nav class="links"><button id="archBtn">Archive</button><button id="practiceBtn">Practice round</button><button id="muteBtn">Sound: on</button></nav>
</main>
<div id="modal" class="modal" hidden><div class="box"><button class="x" data-close>✕</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast" hidden></div>
<script src="../../shared/bp.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
