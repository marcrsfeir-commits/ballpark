<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1510">
<title>Fair Share · BALLPARK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6.5' fill='%23d9a55b'/%3E%3Cpath d='M3 13 L13 3' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body data-bp-pos="bl">
<div class="app">
  <header class="bar">
    <div class="brand"><b>FAIR SHARE</b><span id="mode">DAILY</span></div>
    <div class="pips" id="pips" aria-label="Rounds"></div>
    <button class="icon" id="mute" type="button" aria-label="Mute sound"></button>
  </header>
  <div class="target" id="target" aria-live="polite">
    <div class="ask" id="ask">Cut it in HALF</div>
    <div class="hint" id="hint">Swipe one straight line across the treat</div>
  </div>
  <div class="stage" id="stage"><canvas id="c" aria-label="Cutting board"></canvas><div class="pop" id="pop" hidden></div></div>
  <footer class="foot">
    <div class="msg" id="msg"></div>
    <button class="btn" id="next" type="button" hidden>Next treat</button>
  </footer>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <div class="logo" id="logo"></div>
    <h1>FAIR SHARE</h1>
    <p class="lede">One swipe, one straight cut. Split each treat into <b>exactly</b> the share asked: half, a third, a quarter. No do-overs.</p>
    <div class="stats" id="stats"></div>
    <button class="btn big" id="playDaily" type="button">Today's five treats</button>
    <button class="btn ghost" id="playPractice" type="button">Practice (endless)</button>
    <p class="keys">Keyboard: arrows aim the knife, Enter cuts.</p>
  </div>
</div>

<div class="overlay" id="results" hidden>
  <div class="card">
    <div class="kicker" id="rDate">TODAY</div>
    <div class="total" id="rTotal">0</div>
    <div class="outof">out of 500</div>
    <div class="verdict" id="rVerdict"></div>
    <ol class="rows" id="rRows"></ol>
    <div class="row-btns">
      <button class="btn big" id="share" type="button">Copy result</button>
      <button class="btn ghost" id="toPractice" type="button">Practice</button>
    </div>
    <p class="next-in" id="nextIn"></p>
  </div>
</div>
<script src="../../shared/bp.js"></script>
<script src="game.js"></script>
</body>
</html>
