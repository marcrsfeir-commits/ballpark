<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Password Panic · BALLPARK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='7' width='12' height='8' rx='2' fill='%23111'/%3E%3Cpath d='M5 7V5a3 3 0 0 1 6 0v2' fill='none' stroke='%23111' stroke-width='1.8'/%3E%3C/svg%3E">
<style>
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fbfaf6; color: #1b1b1f; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
  .wrap { width: min(620px, calc(100vw - 28px)); margin: 0 auto; padding: 40px 0 90px; }
  h1 { margin: 0; text-align: center; font-size: 34px; font-weight: 800; }
  .sub { text-align: center; color: #6b6b75; margin: 6px 0 22px; }
  label { display: block; font-weight: 700; margin-bottom: 6px; }
  .box { position: relative; }
  textarea { width: 100%; min-height: 64px; resize: none; padding: 14px 54px 14px 14px; border: 2px solid #1b1b1f; border-radius: 12px; background: #fff;
    font: 600 20px/1.45 "Segoe UI", system-ui, sans-serif; outline: none; font-variant-ligatures: none; overflow: hidden; word-break: break-all; }
  textarea:focus { box-shadow: 0 0 0 4px rgba(27,27,31,.08); }
  .count { position: absolute; right: 12px; top: 14px; font: 700 14px Consolas, monospace; color: #8a8a94; }
  .emoji { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  .emoji button { border: 1px solid #ddd; background: #fff; border-radius: 8px; font: 700 16px/1 Consolas, monospace; padding: 4px 7px; cursor: pointer; min-height: 32px; display: inline-flex; align-items: center; }
  .emoji button svg { width: 22px; height: 22px; display: block; }
  .rule h4 svg { width: 12px; height: 12px; vertical-align: -1px; margin-right: 4px; }
  .emoji span { font-size: 12px; color: #888; align-self: center; margin-right: 4px; }
  .rules { margin-top: 18px; display: grid; gap: 10px; }
  .rule { border-radius: 10px; overflow: hidden; border: 2px solid #e5484d; background: #fff4f4; }
  .rule.ok { border-color: #30a46c; background: #f0fbf4; }
  @keyframes in { from { opacity: 0; transform: translateY(-8px); } }
  .rule h4 { margin: 0; padding: 6px 12px; font-size: 13px; color: #fff; background: #e5484d; }
  .rule.ok h4 { background: #30a46c; }
  .rule p { margin: 0; padding: 10px 12px; font-size: 15.5px; }
  .swatch { display: inline-block; width: 70px; height: 34px; border-radius: 6px; vertical-align: middle; margin-right: 8px; border: 1px solid rgba(0,0,0,.15); }
  .reroll { border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  .confirm { margin-top: 16px; }
  .win { margin-top: 22px; padding: 22px; text-align: center; border-radius: 14px; background: #1b1b1f; color: #fff; animation: in .4s ease; }
  .win h2 { margin: 0 0 6px; font-size: 26px; }
  .win button { margin: 12px 4px 0; padding: 10px 16px; border-radius: 999px; border: 0; background: #fff; color: #1b1b1f; font-weight: 800; cursor: pointer; }
  .win .hints { margin-top: 4px; color: #c9c9d2; font-size: 14px; }
  .rule.new { animation: in .35s ease; }
  .rule h4 { display: flex; align-items: center; gap: 8px; }
  .rule h4 .lbl { flex: 1; }
  .hintbtn { border: 1px solid rgba(255,255,255,.7); background: rgba(255,255,255,.16); color: #fff; border-radius: 999px; padding: 3px 10px; min-height: 26px;
    font: 700 12px/1 "Segoe UI", system-ui, sans-serif; cursor: pointer; }
  .hintbtn:hover { background: rgba(255,255,255,.3); }
  .hintbtn:focus-visible, .reroll:focus-visible, .emoji button:focus-visible, .win button:focus-visible { outline: 3px solid #1b1b1f; outline-offset: 2px; }
  .rule h4 .hintbtn:focus-visible { outline-color: #fff; }
  .hint { margin: 0 12px 10px; padding: 7px 10px; border-radius: 8px; background: #fff; border: 1px dashed #b9b9c3; font-size: 14px; color: #3a3a44; }
  .hint b { color: #1b1b1f; }
  .live { color: #6b6b75; font-size: 13.5px; white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .rule, .rule.new, .win { animation: none !important; } }
</style>
</head>
<body data-bp-pos="br">
<main class="wrap">
  <h1>Password Panic</h1>
  <p class="sub">Please choose a password. It has a few… requirements.</p>
  <label for="pw">Enter a password</label>
  <div class="box"><textarea id="pw" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea><span class="count" id="count">0</span></div>
  <div class="emoji" id="emoji" hidden><span>insert:</span></div>
  <div id="confirmBox" class="confirm" hidden><label for="pw2">Confirm your password</label><textarea id="pw2" rows="1" spellcheck="false" autocomplete="off"></textarea></div>
  <div id="win" class="win" hidden></div>
  <section class="rules" id="rules"></section>
</main>
<script src="../../shared/bp.js"></script>
<script>
// PASSWORD PANIC — rules unlock one by one; every revealed rule must stay satisfied.
const store = Ballpark.store('password');
const $ = id => document.getElementById(id);
const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
const PLANETS = ['mercury','venus','earth','mars','jupiter','saturn','uranus','neptune'];
const OCEANS = ['pacific','atlantic','indian','arctic','southern'];
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const ELEMENTS = 'He Li Be Ne Na Mg Al Si Cl Ar Ca Sc Ti Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og'.split(' ');
const MOONS = ['new moon', 'waxing crescent', 'first quarter', 'waxing gibbous', 'full moon', 'waning gibbous', 'last quarter', 'waning crescent'];
const moonPos = () => (((Date.now() - Date.UTC(2000, 0, 6, 18, 14)) / 86400000) % 29.530589) / 29.530589 * 8; // 0..8, 0 = new
const moonNow = () => MOONS[Math.round(moonPos()) % 8];
// forgiving near a phase boundary (~a day either side): the neighbouring phase also counts
const moonOk = () => { const x = moonPos(); return [...new Set([x - .25, x, x + .25].map(v => MOONS[(Math.round(v) + 8) % 8]))]; };
// a drawn moon in phase k (0 = new, 4 = full); the insert button shows the picture and types the phase's name
const moonSvg = k => {
  const r = 10, c = 12, rx = Math.abs(Math.cos(k / 8 * 2 * Math.PI)) * r, wax = k < 4, gib = k > 2 && k < 6;
  const lit = k === 0 ? '' : k === 4 ? `<circle cx="${c}" cy="${c}" r="${r}" fill="#f5d77e"/>`
    : `<path d="M${c} ${c - r} A${r} ${r} 0 0 ${wax ? 1 : 0} ${c} ${c + r} A${rx.toFixed(2)} ${r} 0 0 ${wax ? (gib ? 1 : 0) : (gib ? 0 : 1)} ${c} ${c - r}Z" fill="#f5d77e"/>`;
  return `<svg viewBox="0 0 24 24" aria-label="${MOONS[k]}"><circle cx="${c}" cy="${c}" r="${r}" fill="#2a2a35"/>${lit}</svg>`;
};
const FISH = '><>';
const romanValue = s => { const v = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 }; let t = 0; for (let i = 0; i < s.length; i++) { const a = v[s[i]], b = v[s[i + 1]] || 0; t += a < b ? -a : a; } return t; };
const isPrime = n => { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
const runs = (s, re) => s.match(re) || [];
const len = p => [...p].length;
const digitSum = p => runs(p, /\d/g).reduce((s, d) => s + +d, 0);
const romanRuns = p => runs(p, /[IVXLCDM]+/g);
const romanProduct = p => romanRuns(p).reduce((s, x) => s * romanValue(x), 1);
// Colour channels start with 0 or a–f, so a digit-free "close enough" code always exists and the hex rule
// can never push the digit sum (rule 5) past 25. Matching allows each channel to be a little off.
const HEX_TOL = 0x18;
const newHex = () => Array.from({ length: 3 }, () => '0abcdef'[Math.floor(Math.random() * 7)] + '0123456789abcdef'[Math.floor(Math.random() * 16)]).join('');
const hexOk = h => /^(?:[0a-f][0-9a-f]){3}$/.test(h || '');
let hex = store.get('hex', null);
if (!hexOk(hex)) { hex = newHex(); store.set('hex', hex); }
const chans = h => [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
const hexClose = p => runs(p.toLowerCase(), /#[0-9a-f]{6}/g).some(c => { const a = chans(c.slice(1)), b = chans(hex); return a.every((v, i) => Math.abs(v - b[i]) <= HEX_TOL); });
const hexEasy = () => hex.replace(/(.)(.)/g, (_, hi, lo) => hi + (hi === '0' ? '0' : /\d/.test(lo) ? 'a' : lo)); // digit-free twin within tolerance
const lvl = v => v < 0x40 ? 'none' : v < 0xb0 ? 'some' : v < 0xe0 ? 'lots' : 'full';
const nextPrime = n => { while (!isPrime(n)) n++; return n; };
const prevPrime = n => { while (n > 1 && !isPrime(n)) n--; return n; };
const live = s => ` <span class="live">(${s})</span>`;
const T = r => typeof r.t === 'function' ? r.t(pw.value) : r.t;

// Each rule: t = text, f = test, h = hints (strings or p => string), shown one level at a time.
const RULES = [
  { t: 'Your password must be at least 5 characters.', f: p => len(p) >= 5,
    h: ['Any five characters count — letters, digits, symbols, even spaces.'] },
  { t: 'Your password must include a number.', f: p => /\d/.test(p),
    h: ['Any digit 0–9. Small ones are friendlier later on.'] },
  { t: 'Your password must include an uppercase letter.', f: p => /[A-Z]/.test(p),
    h: ['Any capital letter. Heads-up: capital I, V, X, L, C, D and M count as Roman numerals later — a <b>V</b> is a safe pick.'] },
  { t: 'Your password must include a special character.', f: p => /[^A-Za-z0-9\s]/.test(p),
    h: ['Something like <b>!</b> <b>?</b> <b>@</b> or <b>-</b>.'] },
  { t: p => 'The digits in your password must add up to 25.' + live(`now ${digitSum(p)}`), f: p => digitSum(p) === 25,
    h: [p => `Each digit counts on its own: 99 is 9 + 9 = 18. You're at <b>${digitSum(p)}</b>, so you need ${digitSum(p) < 25 ? `${25 - digitSum(p)} more` : `${digitSum(p) - 25} less`}.`,
      'Keep a small block of digits (e.g. <b>97</b>) you can tweak — later rules add digits, and you\'ll trim this block to stay at 25.'] },
  { t: 'Your password must include a month of the year.', f: p => MONTHS.some(m => p.toLowerCase().includes(m)),
    h: ['The shortest month is three letters. Lowercase keeps it out of the Roman numerals.', 'Type <b>may</b>.'] },
  { t: 'Your password must include a Roman numeral.', f: p => /[IVXLCDM]/.test(p),
    h: ['A capital I, V, X, L, C, D or M.'] },
  { t: 'Your password must include the name of a planet in our solar system.', f: p => PLANETS.some(m => p.toLowerCase().includes(m)),
    h: ['The red one is only four letters.', 'Type <b>mars</b> (lowercase).'] },
  { t: p => 'The Roman numerals in your password should multiply to 35.' + live(romanRuns(p).length ? `now ${romanRuns(p).join(' × ')} = ${romanProduct(p)}` : 'none yet'),
    f: p => { const r = romanRuns(p); return r.length > 0 && romanProduct(p) === 35; },
    h: ['Every run of capital I/V/X/L/C/D/M is one numeral, and they all multiply. 35 = 5 × 7. Write your other words in lowercase.',
      'Use <b>XXXV</b> on its own, or <b>V</b> and <b>VII</b> kept apart by another character.'] },
  { t: 'Your password must include today\'s day of the week.', f: p => p.toLowerCase().includes(DAYS[new Date().getDay()]),
    h: [() => `It starts with <b>${DAYS[new Date().getDay()][0]}</b>.`, () => `Today is <b>${DAYS[new Date().getDay()]}</b>.`] },
  { t: 'Your password must include a two-letter symbol from the periodic table.', f: p => ELEMENTS.some(e => p.includes(e)),
    h: ['Capital letter, then lowercase — like the gas in party balloons.', '<b>He</b>, <b>Fe</b>, <b>Ne</b> or <b>Au</b> all work and add no Roman numerals.'] },
  { t: 'Your password must include a leap year.', f: p => runs(p, /\d+/g).some(n => n.length === 4 && ((+n % 4 === 0 && +n % 100 !== 0) || +n % 400 === 0)),
    h: ['Four digits, divisible by 4 — century years only if divisible by 400 (so not 1900).', '<b>2000</b> works and only adds 2 to your digit sum. Keep it away from other digits.'] },
  { t: 'Your password must include the current phase of the moon, in words.', f: p => moonOk().some(m => p.toLowerCase().includes(m)), emoji: MOONS.map((m, k) => ({ html: moonSvg(k), ins: m })),
    h: [() => { const k = MOONS.indexOf(moonNow()), other = MOONS[(k + (k % 2 ? 3 : 5)) % 8], pair = [moonNow(), other].sort(); return `It's either <b>${pair[0]}</b> or <b>${pair[1]}</b>. The insert buttons above type the name for you.`; },
      () => `Tonight it's a <b>${moonNow()}</b>.`] },
  { t: () => `<span class="swatch" style="background:#${hex}"></span>Your password must include the hex code of this colour (close enough counts). <button class="reroll" id="reroll" type="button" title="New colour" aria-label="New colour">↻</button>`, f: hexClose,
    h: [() => { const [r, g, b] = chans(hex); return `Write it like <b>#rrggbb</b>. Each pair may be a little off. Red: ${lvl(r)}, green: ${lvl(g)}, blue: ${lvl(b)} (00 = none, ff = full).`; },
      () => `<b>#${hexEasy()}</b> is close enough and has no digits${hexEasy() !== hex ? ` (the exact code is #${hex})` : ''}.`] },
  { t: 'Your password must include the name of an ocean.', f: p => OCEANS.some(m => p.toLowerCase().includes(m)),
    h: ['There are five. One is named after a country.', 'Type <b>indian</b>.'] },
  { t: 'Your password must include a fish: <b>&gt;&lt;&gt;</b> He lives here now.', f: p => p.includes(FISH), emoji: [{ html: '&gt;&lt;&gt;', ins: FISH }],
    h: ['Use the fish button in the insert row above, or type &gt; &lt; &gt;.'] },
  { t: 'Your password must include the answer to 12 × 12.', f: p => p.includes('144'),
    h: ['A dozen dozen — also called a gross. Mind your digit sum: it adds 9.', 'It\'s <b>144</b>.'] },
  { t: p => 'The length of your password must be a prime number.' + live(`now ${len(p)}`), f: p => isPrime(len(p)),
    h: [p => { const n = len(p); return isPrime(n) ? `${n} is prime — nice.` : `You're at ${n}. Nearest primes: <b>${prevPrime(n)}</b> and <b>${nextPrime(n)}</b>. Letters and spaces make easy padding.`; }] },
  { t: 'Your password must include its own length.', f: p => runs(p, /\d+/g).includes(String(len(p))),
    h: ['Write the length as digits, apart from other digits — but they make it longer (and change your digit sum).',
      p => { if (runs(p, /\d+/g).includes(String(len(p)))) return `Done: your password is ${len(p)} characters and says so.`; let n = len(p) + 1; for (;;) { const P = nextPrime(n); if (P >= len(p) + String(P).length) { n = P; break; } n = P + 1; }
        return `Aim for <b>${n}</b> characters: add "${n}", pad with letters until the counter reads ${n}, then trim your digit block so rule 5 adds up to 25 again (fix the count afterwards).`; }] },
];

let reached = store.get('reached', 0), startT = null, won = false;
let hints = store.get('hints', {}); if (!hints || typeof hints !== 'object') hints = {};
const hintsUsed = () => Object.values(hints).reduce((s, n) => s + (+n || 0), 0);
let seen = reached + 1; // rules up to here are already on screen: don't animate them again
const pw = $('pw');
pw.value = store.get('draft', '');
function grow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
const ICON_OK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_NO = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>';
function check() {
  const p = pw.value;
  $('count').textContent = len(p);
  store.set('draft', p);
  if (p && startT == null) startT = Date.now();
  // reveal the next rule once every visible rule passes
  while (reached < RULES.length && RULES.slice(0, reached + 1).every(r => r.f(p))) reached++;
  store.set('reached', reached);
  const shown = Math.min(Math.max(reached + 1, p.length ? 1 : 0), RULES.length);
  const cards = [];
  for (let i = shown - 1; i >= 0; i--) {
    const r = RULES[i], ok = r.f(p), used = Math.min(+hints[i] || 0, r.h.length);
    const hintHtml = r.h.slice(0, used).map(h => `<p class="hint" role="note">${typeof h === 'function' ? h(p) : h}</p>`).join('');
    const btn = used < r.h.length ? `<button type="button" class="hintbtn" data-hint="${i}" aria-label="${used ? 'Another hint' : 'Hint'} for rule ${i + 1}">${used ? 'More' : 'Hint'}</button>` : '';
    cards.push({ ok, html: `<div class="rule ${ok ? 'ok' : ''}${i >= seen ? ' new' : ''}" data-rule="${i}"><h4>${ok ? ICON_OK : ICON_NO}<span class="lbl">Rule ${i + 1}</span>${btn}</h4><p>${T(r)}</p>${hintHtml}</div>` });
  }
  seen = Math.max(seen, shown);
  // keep unsatisfied rules on top, like a nagging IT department
  $('rules').innerHTML = cards.sort((a, b) => a.ok - b.ok).map(c => c.html).join('');
  const rr = $('reroll'); if (rr) rr.onclick = () => { hex = newHex(); store.set('hex', hex); check(); $('reroll')?.focus(); };
  $('rules').querySelectorAll('.hintbtn').forEach(b => b.onclick = () => {
    const i = +b.dataset.hint; hints[i] = (+hints[i] || 0) + 1; store.set('hints', hints); check();
    (document.querySelector(`.hintbtn[data-hint="${i}"]`) || document.querySelector(`.rule[data-rule="${i}"] .hint:last-of-type`))?.focus?.();
  });
  $('rules').querySelectorAll('.hint').forEach(h => h.tabIndex = -1);
  const emojis = RULES.slice(0, shown).flatMap(r => r.emoji || []);
  $('emoji').hidden = !emojis.length;
  $('emoji').innerHTML = '<span>insert:</span>' + emojis.map((e, i) => `<button type="button" data-i="${i}" title="${e.ins.replace(/[<>]/g, '')}" aria-label="Insert ${e.ins === FISH ? 'fish' : e.ins}">${e.html}</button>`).join('');
  $('emoji').querySelectorAll('button').forEach(b => b.onclick = () => insert(emojis[+b.dataset.i].ins));
  const all = RULES.every(r => r.f(p));
  $('confirmBox').hidden = !(all && shown === RULES.length);
  grow(pw);
}
function insert(s) {
  const a = pw.selectionStart ?? pw.value.length, b = pw.selectionEnd ?? a;
  pw.value = pw.value.slice(0, a) + s + pw.value.slice(b);
  pw.focus(); pw.setSelectionRange(a + s.length, a + s.length); check();
}
pw.addEventListener('input', check);
$('pw2').addEventListener('input', e => {
  grow(e.target);
  if (!won && e.target.value === pw.value && RULES.every(r => r.f(pw.value))) {
    won = true;
    const secs = Math.round((Date.now() - (startT || Date.now())) / 1000), mmss = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
    const n = hintsUsed(), hintTxt = n ? `${n} hint${n === 1 ? '' : 's'}` : 'no hints';
    const best = store.get('best', null); if (best == null || secs < best) store.set('best', secs);
    Ballpark.report('password', { score: secs, label: `cracked in ${mmss}${n ? ` · ${hintTxt}` : ''}` });
    $('win').hidden = false;
    $('win').innerHTML = `<h2>Password accepted.</h2><div>${len(pw.value)} characters of pure suffering, done in ${mmss}.</div>
      <div class="hints">${n ? `Used ${hintTxt}.` : 'No hints used. Respect.'}</div>
      <button id="again" type="button">New password</button><button id="share" type="button">Copy result</button>`;
    $('again').onclick = () => { store.set('draft', ''); store.set('reached', 0); store.set('hints', {}); location.reload(); };
    $('share').onclick = () => navigator.clipboard?.writeText(`Password Panic: beat all ${RULES.length} rules in ${mmss} (${hintTxt})\nBALLPARK`).then(() => { $('share').textContent = 'Copied!'; });
  }
});
check();
pw.focus();
</script>
</body>
</html>
