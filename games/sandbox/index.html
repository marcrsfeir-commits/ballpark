<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f16">
<meta name="description" content="Sandlot: a falling-sand physics sandbox. Paint sand, water, lava and acid, spawn walkers and bombs, then hit it all with lightning, viruses and black holes.">
<title>Sandlot · BALLPARK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230c0f16'/%3E%3Crect x='2' y='11' width='12' height='3' fill='%23e3c27a'/%3E%3Crect x='4' y='9' width='6' height='2' fill='%23e3c27a'/%3E%3Crect x='10' y='8' width='4' height='3' fill='%233b82f6'/%3E%3Crect x='6' y='3' width='2' height='2' fill='%23ff7a1a'/%3E%3Crect x='7' y='5' width='2' height='2' fill='%23ffb347'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body data-bp-pos="tl">
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>SANDLOT</h1>
      <p class="sub">Pick a tool, paint the world, watch it react.</p>
    </div>
    <div class="hud" id="hud" aria-live="polite"></div>
  </header>

  <div class="stage" id="stage">
    <canvas id="world" aria-label="Sandbox world. Drag to use the selected tool."></canvas>
    <div class="tip" id="tip"></div>
    <div class="paused-badge" id="pausedBadge" hidden>PAUSED</div>
  </div>

  <div class="bar" id="bar">
    <label class="brush" title="Brush size ( [ and ] )">
      <span class="brush-dot" id="brushDot"></span>
      <input type="range" id="brush" min="1" max="20" value="4" aria-label="Brush size">
      <b id="brushVal">4</b>
    </label>
    <div class="ctrls" id="ctrls"></div>
  </div>

  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="tools" id="tools"></div>
</div>

<div class="modal" id="snap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="snapTitle">
    <h2 id="snapTitle">Snapshot</h2>
    <img id="snapImg" alt="Snapshot of your sandbox">
    <pre id="snapText"></pre>
    <div class="btns">
      <button class="btn primary" id="snapCopy" type="button">Copy summary</button>
      <button class="btn" id="snapSave" type="button">Save image</button>
      <button class="btn" id="snapClose" type="button">Close</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="../../shared/bp.js"></script>
<script src="game.js"></script>
</body>
</html>
