<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circle Up · BALLPARK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%2334d399' stroke-width='2'/%3E%3Ccircle cx='8' cy='8' r='1.2' fill='white'/%3E%3C/svg%3E">
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #0d0f14; color: #fff; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; overflow: hidden; touch-action: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  .top { position: fixed; top: 18px; left: 0; right: 0; text-align: center; pointer-events: none; }
  .top h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .02em; }
  .top p { margin: 4px 0 0; font-size: 13px; color: #8b93a7; }
  .best { position: fixed; top: 18px; right: 18px; font: 600 12px Consolas, monospace; color: #8b93a7; text-align: right; }
  .best b { color: #fff; font-size: 16px; }
  .score { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
  .score .pct { font: 800 clamp(44px, 9vw, 76px)/1 "Segoe UI", system-ui, sans-serif; letter-spacing: -.02em; }
  .score .msg { margin-top: 8px; font-size: 15px; color: #c7cbd6; min-height: 20px; }
  .actions { position: fixed; bottom: 22px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; }
  .actions button { padding: 10px 18px; border-radius: 999px; border: 1px solid #2c3242; background: #161a23; color: #fff; font: 600 14px "Segoe UI", system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body data-bp-pos="bl">
<canvas id="c"></canvas>
<div class="top"><h1>Circle Up</h1><p>Draw a perfect circle around the dot.</p></div>
<div class="best">BEST TODAY<br><b id="bestToday">—</b><br>ALL-TIME <b id="bestAll">—</b></div>
<div class="score"><div id="pct" class="pct"></div><div id="msg" class="msg"></div></div>
<div class="actions" id="actions" hidden><button id="share">Copy score</button></div>
<script src="../../shared/bp.js"></script>
<script>
// CIRCLE UP — draw around the dot; score = how close the radius stays to its average.
const cv = document.getElementById('c'), g = cv.getContext('2d');
const store = Ballpark.store('circle');
let W, H, cx, cy, pts = [], drawing = false, swept = 0, lastA = null, final = null;
function resize() {
  const d = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0);
  cx = W / 2; cy = H / 2 + 10; redraw();
}
addEventListener('resize', resize);

function stats() {
  const rs = pts.map(p => Math.hypot(p.x - cx, p.y - cy));
  const mean = rs.reduce((a, b) => a + b, 0) / rs.length;
  const err = rs.reduce((a, r) => a + Math.abs(r - mean), 0) / rs.length / mean;
  return { mean, err, score: Math.max(0, 100 * (1 - 3 * err)) };
}
function colorFor(r, mean) {
  const k = Math.min(1, Math.abs(r - mean) / mean / 0.12);           // 0 = perfect, 1 = way off
  return `hsl(${140 - 140 * k} 85% 55%)`;
}
function redraw() {
  g.clearRect(0, 0, W, H);
  g.fillStyle = '#fff'; g.beginPath(); g.arc(cx, cy, 5, 0, Math.PI * 2); g.fill();
  if (pts.length < 2) return;
  const { mean } = stats();
  g.lineWidth = 6; g.lineCap = 'round';
  for (let i = 1; i < pts.length; i++) {
    const r = Math.hypot(pts[i].x - cx, pts[i].y - cy);
    g.strokeStyle = colorFor(r, mean);
    g.beginPath(); g.moveTo(pts[i - 1].x, pts[i - 1].y); g.lineTo(pts[i].x, pts[i].y); g.stroke();
  }
  if (final != null) {                                                  // ghost of the ideal circle
    g.setLineDash([4, 8]); g.lineWidth = 1.5; g.strokeStyle = 'rgba(255,255,255,.35)';
    g.beginPath(); g.arc(cx, cy, mean, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
  }
}
const pctEl = document.getElementById('pct'), msgEl = document.getElementById('msg');
function start(e) {
  drawing = true; final = null; pts = [{ x: e.clientX, y: e.clientY }]; swept = 0; lastA = null;
  msgEl.textContent = ''; document.getElementById('actions').hidden = true;
}
function move(e) {
  if (!drawing) return;
  const p = { x: e.clientX, y: e.clientY };
  pts.push(p);
  const a = Math.atan2(p.y - cy, p.x - cx);
  if (lastA != null) { let d = a - lastA; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; swept += d; }
  lastA = a;
  const s = stats();
  if (s.mean < 40) { fail('Too close to the dot!'); return; }
  pctEl.textContent = pts.length > 8 ? s.score.toFixed(1) + '%' : '';
  pctEl.style.color = colorFor(s.mean * (1 + Math.min(0.12, s.err)), s.mean);
  redraw();
  if (Math.abs(swept) >= Math.PI * 2) finish();
}
function fail(text) { drawing = false; final = null; pctEl.textContent = 'XX.X%'; pctEl.style.color = '#ef4444'; msgEl.textContent = text; redraw(); }
function finish() {
  if (!drawing) return;
  drawing = false;
  if (pts.length < 20 || Math.abs(swept) < Math.PI * 1.85) return fail('Draw a full circle!');
  const s = stats();
  final = s.score;
  pctEl.textContent = final.toFixed(1) + '%';
  pctEl.style.color = colorFor(s.mean * (1 + Math.min(0.12, s.err)), s.mean);
  msgEl.textContent = final >= 98 ? 'Are you a compass?' : final >= 95 ? 'Wow, that is round.' : final >= 90 ? 'Very nice circle.' : final >= 80 ? 'Not bad at all.' : final >= 60 ? 'A respectable egg.' : 'That is… a shape.';
  redraw();
  const day = Ballpark.today(), b = store.get('best', { day: null, today: 0, all: 0 });
  if (b.day !== day) { b.day = day; b.today = 0; }
  if (final > b.today) { b.today = final; Ballpark.report('circle', { score: Math.round(final * 10) / 10, max: 100, label: `best ${final.toFixed(1)}%` }); }
  if (final > b.all) b.all = final;
  store.set('best', b); showBest();
  document.getElementById('actions').hidden = false;
}
function showBest() {
  const b = store.get('best', { day: null, today: 0, all: 0 });
  document.getElementById('bestToday').textContent = b.day === Ballpark.today() && b.today ? b.today.toFixed(1) + '%' : '—';
  document.getElementById('bestAll').textContent = b.all ? b.all.toFixed(1) + '%' : '—';
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); start(e); });
cv.addEventListener('pointermove', move);
cv.addEventListener('pointerup', finish);
document.getElementById('share').onclick = () => navigator.clipboard?.writeText(`Circle Up: ${final.toFixed(1)}% ⭕\nBALLPARK`).then(() => { document.getElementById('share').textContent = 'Copied!'; });
resize(); showBest();
</script>
</body>
</html>
